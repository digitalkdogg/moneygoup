site_name: GrowMYStocks Docs
site_description: Internal documentation for the GrowMYStocks stock prediction platform
site_author: GrowMYStocks Team
docs_dir: docs
site_dir: site

theme:
  name: material
  palette:
    - scheme: default
      primary: green
      accent: light green
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: green
      accent: light green
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - toc.follow

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

nav:
  - Overview:
    - What is GrowMYStocks: index.md
    - Architecture: architecture.md
    - Glossary: glossary.md
  - Business Rules:
    - GPS Score: business-rules/gps-score.md
    - Scoring & Thresholds: business-rules/scoring-thresholds.md
    - Strategy System: business-rules/strategy-system.md
    - Recommendation Buckets: business-rules/recommendation-buckets.md
  - Data & Integrations:
    - DeepMoney Sync: data-integrations/deepmoney-sync.md
    - Technical Indicators: data-integrations/technical-indicators.md
    - Model Training: data-integrations/model-training.md
  - System Flows:
    - Prediction Pipeline: system-flows/prediction-pipeline.md
    - Authentication Flow: system-flows/auth-flow.md
    - Admin & User Management: system-flows/admin-user-mgmt.md
  - Reference:
    - API Routes: reference/api-routes.md
    - Database Schema: reference/database-schema.md
    - Components: reference/components.md
    - Environment Variables: reference/env-vars.md
    - Style Guide: reference/style-guide.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/digitalkdogg/moneygoup

plugins:
  - search:
      lang: en
